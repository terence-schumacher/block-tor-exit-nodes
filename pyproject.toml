[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "block-tor-exit-nodes"
version = "1.0.0"
description = "Block app access from known TOR exit nodes (SRE-1097)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flask>=3.0",
    "mypy>=1.0",
    "black>=24.0",
    "types-requests>=2.28",
]

[project.scripts]
tor-exit-fetch = "tor_exit_block.fetcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tor_exit_block*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that use real I/O and a local stub HTTP server",
    "e2e: end-to-end tests (fetch → app → block/allow)",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.mypy_cache
  | \.venv
  | build
  | dist
)/
'''
